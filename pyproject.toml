[project]
name = "halo"
version = "0.1.0"
description = "Halo: batch query processing and optimization for agentic workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.11.0",
    "pyyaml>=6.0.0",
    "datasets>=4.4.1",
    "pulp>=2.7.0",
]

[project.optional-dependencies]
# DB-engine nodes (db_queries) require a Postgres backend. Pure-LLM workflows do not.
postgres = [
    "psycopg[binary]>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
